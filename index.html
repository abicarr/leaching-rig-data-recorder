<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaching rig data recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202A; --slate:#4A5A69; --mute:#7B8A97;
  --mist:#E4E9ED; --edge:#C9D3DA; --paper:#F7F9FA; --white:#fff;
  --signal:#0E7C86; --signal-soft:#E2F1F2; --signal-deep:#0A5A62;
  --derived:#8A4B00; --derived-soft:#FBF0E2;
  --alert:#A3252B;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed',var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sans); font-size:15px; line-height:1.55;
  color:var(--ink); background:var(--paper);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- masthead ---------- */
.masthead{
  background:var(--ink); color:#DDE5EA;
  padding:14px 22px; display:flex; flex-wrap:wrap; gap:18px;
  align-items:baseline; justify-content:space-between;
  border-bottom:3px solid var(--signal);
}
.masthead h1{
  font-family:var(--cond); font-weight:600; font-size:19px;
  margin:0; letter-spacing:.01em; color:#fff;
}
.masthead h1 small{
  display:block; font-family:var(--mono); font-size:10.5px; font-weight:400;
  letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin-bottom:3px;
}
.readout{font-family:var(--mono);font-size:11.5px;color:#9FB0BC;display:flex;gap:14px;flex-wrap:wrap}
.readout b{color:var(--signal-soft);font-weight:500}
.readout .live::before{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--signal);margin-right:6px;vertical-align:1px;
}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 58px)}
.rail{background:var(--white);border-right:1px solid var(--edge);padding:16px 0}
.rail-head{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);padding:0 18px 8px;
}
.rail button{
  display:flex;width:100%;align-items:baseline;gap:8px;
  background:none;border:0;border-left:3px solid transparent;
  padding:7px 18px;text-align:left;cursor:pointer;color:var(--slate);
}
.rail button:hover{background:var(--paper);color:var(--ink)}
.rail button[aria-current=true]{
  border-left-color:var(--signal);background:var(--signal-soft);
  color:var(--ink);font-weight:500;
}
.rail button .n{font-family:var(--mono);font-size:11px;color:var(--mute);margin-left:auto}
.rail .depth1{padding-left:30px}
.rail .depth2{padding-left:42px}

.main{padding:24px 26px 60px;min-width:0}
.crumb{font-family:var(--mono);font-size:11px;color:var(--mute);margin-bottom:6px}
.crumb button{background:none;border:0;padding:0;color:var(--signal);cursor:pointer;font:inherit;text-decoration:underline}
h2{font-family:var(--cond);font-weight:600;font-size:26px;margin:0 0 2px}
.sub{color:var(--slate);font-size:13.5px;margin:0 0 20px}
.sub code{font-family:var(--mono);font-size:12px;background:var(--mist);padding:1px 5px;border-radius:3px}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btn{
  background:var(--signal);color:#fff;border:0;border-radius:5px;
  padding:8px 15px;font-weight:500;font-size:14px;cursor:pointer;
}
.btn:hover{background:var(--signal-deep)}
.btn.ghost{background:none;color:var(--signal);border:1px solid var(--edge)}
.btn.ghost:hover{background:var(--signal-soft)}
.search{
  flex:1;min-width:160px;max-width:300px;padding:8px 11px;
  border:1px solid var(--edge);border-radius:5px;background:var(--white);
}

/* ---------- table ---------- */
.tablewrap{background:var(--white);border:1px solid var(--edge);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{
  font-family:var(--cond);font-weight:600;font-size:12.5px;text-align:left;
  padding:9px 12px;background:var(--paper);border-bottom:1px solid var(--edge);
  white-space:nowrap;position:sticky;top:0;
}
th .fx{color:var(--derived);font-family:var(--mono);font-size:10px;margin-left:4px}
th .lk{color:var(--signal);font-family:var(--mono);font-size:10px;margin-left:4px}
td{padding:8px 12px;border-bottom:1px solid var(--mist);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--signal-soft)}
tbody tr:last-child td{border-bottom:0}
td.num,td.calc{font-family:var(--mono);font-size:12.5px;text-align:right}
td.calc{color:var(--derived)}
td.key{font-family:var(--mono);font-size:12.5px;color:var(--signal-deep);font-weight:500}
.empty{padding:34px 16px;text-align:center;color:var(--mute);font-size:13.5px}

/* ---------- form ---------- */
.form{background:var(--white);border:1px solid var(--edge);border-radius:8px;padding:20px 22px;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:15px}
.f label{display:block;font-weight:500;font-size:13px;margin-bottom:3px}
.f .hint{display:block;color:var(--mute);font-size:11.5px;margin-bottom:5px;line-height:1.4}
.f input,.f select,.f textarea{
  width:100%;padding:7px 9px;border:1px solid var(--edge);border-radius:5px;background:var(--white);
}
.f input[type=number],.f .ro{font-family:var(--mono);font-size:13px}
.f .ro{
  background:var(--derived-soft);border:1px dashed #DDB884;color:var(--derived);
  padding:7px 9px;border-radius:5px;
}
.f .fxnote{
  display:block;font-family:var(--mono);font-size:10.5px;color:var(--derived);
  margin-top:4px;word-break:break-word;line-height:1.45;
}
.f.wide{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);padding:0;margin-bottom:12px;
  border-bottom:1px solid var(--mist);width:100%;padding-bottom:6px;
}
.addrow{display:flex;gap:6px}
.addrow input{flex:1}
.addrow button{
  border:1px solid var(--edge);background:var(--paper);border-radius:5px;
  padding:0 11px;cursor:pointer;color:var(--signal);font-size:18px;line-height:1;
}
.addrow button:hover{background:var(--signal-soft)}

/* ---------- record detail ---------- */
.pane{background:var(--white);border:1px solid var(--edge);border-radius:8px;padding:20px 22px;margin-bottom:18px}
.pane h3{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin:0 0 14px;font-weight:400;
}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 22px}
.kv dt{font-size:11.5px;color:var(--mute);margin-bottom:1px}
.kv dd{margin:0;font-size:14px;word-break:break-word}
.kv dd.mono{font-family:var(--mono);font-size:13px}
.kv dd.calc{font-family:var(--mono);font-size:13px;color:var(--derived)}
.kv dd button{
  background:none;border:0;padding:0;color:var(--signal);cursor:pointer;
  font:inherit;text-decoration:underline;text-align:left;
}

/* signature: the lineage chain */
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
.link{
  border:1px solid var(--edge);border-radius:6px;padding:8px 12px;background:var(--paper);
  min-width:0;max-width:230px;cursor:pointer;text-align:left;
}
.link:hover{border-color:var(--signal);background:var(--signal-soft)}
.link .t{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);display:block;
}
.link .v{font-size:13px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link.here{border-color:var(--signal);border-width:2px;background:var(--signal-soft)}
.joint{
  align-self:center;font-family:var(--mono);color:var(--edge);
  padding:0 7px;font-size:15px;user-select:none;
}
.branch{margin-top:10px;padding-left:16px;border-left:2px solid var(--mist)}

.chip{
  display:inline-block;font-family:var(--mono);font-size:11px;
  padding:2px 7px;border-radius:3px;background:var(--mist);color:var(--slate);
}
.chip.fx{background:var(--derived-soft);color:var(--derived)}
.chip.lk{background:var(--signal-soft);color:var(--signal-deep)}

/* ---------- connect panel ---------- */
.connect{
  border:1px solid var(--edge);border-left:4px solid var(--signal);border-radius:0 8px 8px 0;
  background:var(--white);padding:16px 20px;max-width:760px;
}
.connect p{margin:0 0 12px;font-size:13.5px;color:var(--slate)}
.connect code{font-family:var(--mono);font-size:12px;background:var(--mist);padding:1px 5px;border-radius:3px}
.connect .status{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--derived);background:var(--derived-soft);padding:3px 9px;border-radius:3px;
  display:inline-block;margin-bottom:12px;
}
pre{
  font-family:var(--mono);font-size:11.5px;background:var(--ink);color:#C7D6DE;
  padding:13px 15px;border-radius:6px;overflow:auto;margin:0;line-height:1.6;
}
pre .c{color:#7B8A97}
pre .s{color:#8FD3C6}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:13.5px;
  box-shadow:0 4px 16px rgba(22,32,42,.22);
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .22s ease-out}
  @keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}
}
@media (max-width:720px){
  .shell{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--edge);padding-bottom:10px}
  .main{padding:18px 15px 50px}
}
</style>
<style>
.banner{padding:11px 22px;font-size:13.5px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
.banner.warn{background:var(--derived-soft);color:var(--derived)}
.banner.bad{background:#FDECEC;color:var(--alert)}
.banner.good{background:var(--signal-soft);color:var(--signal-deep)}
.banner b{font-weight:500}
.banner button{background:none;border:1px solid currentColor;border-radius:5px;padding:4px 11px;
  font-size:12.5px;cursor:pointer;color:inherit;margin-left:auto}
.dupwarn{background:#FDECEC;color:var(--alert);border:1px solid #F0B8B8;border-radius:6px;
  padding:10px 14px;font-size:13.5px;margin-bottom:16px;font-weight:500}
td.dup{color:var(--alert);font-weight:500;white-space:normal;max-width:200px}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.sugg button{background:var(--mist);border:0;border-radius:99px;padding:2px 10px;font-size:12px;
  cursor:pointer;color:var(--slate);font-family:var(--mono)}
.sugg button:hover{background:var(--signal-soft);color:var(--signal-deep)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--edge);
  border-top-color:var(--signal);border-radius:50%;vertical-align:-1px;margin-right:7px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}}
.setup ol{padding-left:22px;margin:0 0 14px}
.setup li{margin-bottom:9px;font-size:13.5px;color:var(--slate);line-height:1.6}
.setup li b{color:var(--ink);font-weight:500}
.field{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-bottom:7px;max-width:560px}
.field label{font-size:12.5px;color:var(--mute);font-family:var(--mono)}
.field input{padding:6px 9px;border:1px solid var(--edge);border-radius:5px;font-family:var(--mono);font-size:12.5px}
</style>

</head>
<body>

<header class="masthead">
  <h1><small>LBBC &middot; project 2406</small>Leaching rig data recorder</h1>
  <div class="readout" id="readout"></div>
</header>
<div id="banner"></div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sheets"></nav>
  <main class="main" id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script>
/* ============================================================
   1. CONFIG  —  the only part you edit
   Fill these in once IT has created the app registration.
   Leave clientId blank to browse a sample copy without signing in.
   ============================================================ */
const CONFIG = {
  clientId: "5cf08e58-b378-4c33-ad73-6a1ba233b4d8",
  tenantId: "376e6c05-6d6c-4c87-a72f-525d8c163b3b",
  siteHost: "lbbcltd.sharepoint.com",
  sitePath: "/sites/GroupRDTeam",
  filePath: "Projects/2406 Predict Leachability of Cores/Phases/2026 Summer Programme/4 Leaching Rig Relational Databse Design/App/Leaching_Rig_Data_For_App.xlsx"
};

/* ============================================================
   2. GRAPH
   ============================================================ */
const GRAPH = "https://graph.microsoft.com/v1.0";
const SCOPES = ["Sites.ReadWrite.All"];
let pca = null, account = null, siteId = null, itemId = null, session = null;
let live = false, err = null, busy = "";

async function token(){
  const req = { scopes: SCOPES, account };
  try { return (await pca.acquireTokenSilent(req)).accessToken; }
  catch(e){ await pca.acquireTokenRedirect(req); throw new Error("Redirecting to sign in again — this page should reload."); }
}
async function g(path, opts={}){
  const t = await token();
  const h = { Authorization:"Bearer "+t, "Content-Type":"application/json" };
  if(session) h["workbook-session-id"] = session;
  const r = await fetch(GRAPH+path, {...opts, headers:{...h, ...(opts.headers||{})}});
  if(!r.ok){
    let d=""; try{ d=(await r.json()).error?.message||""; }catch(e){}
    throw new Error(`${r.status} on ${path.split("?")[0]}${d?" — "+d:""}`);
  }
  return r.status===204 ? null : r.json();
}
const wbPath = p => `/sites/${siteId}/drive/items/${itemId}/workbook${p}`;

/* Runs once, immediately on page load — not inside the button click.
   This is what lets a redirect flow work at all: pca must exist and be
   initialised, and any redirect response must be collected, before the
   sign-in button is even shown. */
async function initAuth(){
  pca = new msal.PublicClientApplication({
    auth:{ clientId:CONFIG.clientId,
           authority:`https://login.microsoftonline.com/${CONFIG.tenantId||"common"}`,
           redirectUri: location.origin + location.pathname },
    cache:{ cacheLocation:"sessionStorage" }
  });
  await pca.initialize();
  const result = await pca.handleRedirectPromise();   // picks up the return trip from Microsoft, if any
  account = result?.account || pca.getAllAccounts()[0] || null;
  if(account) pca.setActiveAccount(account);
}
/* Called from the sign-in button. Navigates away to Microsoft — no popup,
   so nothing here can be silently blocked by the browser. The page comes
   back to itself afterwards and initAuth() above picks up the result. */
function beginSignIn(){
  return pca.loginRedirect({ scopes: SCOPES });
}

/* ============================================================
   3. LOAD  —  builds SCHEMA, DATA, LISTS, FIELDS from the workbook
   ============================================================ */
let SCHEMA = { workbook:CONFIG.filePath, tables:[] };
let DATA = {}, LISTS = {}, FIELDS = {}, SHEETID = {}, RANGE = {};


function isCalc(formulas, i){
  for(let r=1; r<Math.min(formulas.length, 6); r++){
    const f = formulas[r] && formulas[r][i];
    if(typeof f === "string" && f.startsWith("=")) return true;
  }
  return false;
}
const isDateFmt = f => typeof f==="string" && /y{2,}/i.test(f);

async function loadLive(){
  busy = "Finding the site"; render();
  const site = await g(`/sites/${CONFIG.siteHost}:${CONFIG.sitePath}`);
  siteId = site.id;

  busy = "Finding the workbook"; render();
  const item = await g(`/sites/${siteId}/drive/root:/${CONFIG.filePath.split("/").map(encodeURIComponent).join("/")}`);
  itemId = item.id;

  busy = "Opening a workbook session"; render();
  session = (await g(wbPath("/createSession"), { method:"POST", body:JSON.stringify({persistChanges:true}) })).id;

  busy = "Reading the sheets"; render();
  const sheets = (await g(wbPath("/worksheets?$select=id,name"))).value;
  sheets.forEach(s => SHEETID[s.name] = s.id);

  const tables = (await g(wbPath("/tables?$expand=worksheet($select=id,name)"))).value;
  const usable = tables.filter(t => !t.worksheet.name.startsWith("_"));

  SCHEMA = { workbook:CONFIG.filePath, tables:[] };
  DATA = {};
  for(const t of usable){
    busy = "Reading "+t.worksheet.name; render();
    const rg = await g(wbPath(`/tables/${t.id}/range?$select=values,formulas,numberFormat,address`));
    RANGE[t.worksheet.name] = parseAddr(rg.address);
    const hdr = rg.values[0].map(h => String(h??"").trim());
    const fields = hdr.map((n,i) => ({
      n,
      fx: isCalc(rg.formulas, i) ? String(rg.formulas[1]?.[i]||"") : null,
      date: isDateFmt(rg.numberFormat[1]?.[i]),
      num: !isCalc(rg.formulas,i) && /^[0#]/.test(String(rg.numberFormat[1]?.[i]||"")),
      i
    }));
    SCHEMA.tables.push({ name:t.worksheet.name, table:t.name, id:t.id,
                         sheetId:t.worksheet.id, fields });
    DATA[t.worksheet.name] = rg.values.slice(1)
      .map((row,ri) => rowObj(fields, row, ri))
      .filter(r => r.__filled);
  }

  busy = "Reading _Lists and _Fields"; render();
  LISTS = {}; FIELDS = {};
  if(SHEETID["_Lists"]){
    const u = await g(wbPath(`/worksheets/${SHEETID["_Lists"]}/usedRange?$select=values`));
    const head = u.values[1] || [];
    head.forEach((h,c) => { if(!h) return;
      LISTS[String(h).trim()] = u.values.slice(2).map(r => r[c]).filter(v => v!=="" && v!=null).map(String); });
  }
  if(SHEETID["_Fields"]){
    const u = await g(wbPath(`/worksheets/${SHEETID["_Fields"]}/usedRange?$select=values`));
    u.values.slice(2).forEach(r => { if(r[0] && r[1]) FIELDS[String(r[0]).trim()+"|"+String(r[1]).trim()] = String(r[2]||""); });
  }
  live = true; busy = ""; render();
}

function parseAddr(a){
  const m = /!([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(a);
  return { c1:m[1], r1:+m[2], c2:m[3], r2:+m[4] };
}
function rowObj(fields, row, ri){
  const o = { __row: ri };
  let filled = false;
  fields.forEach(f => {
    let v = row[f.i];
    if(v===null || v===undefined) v = "";
    if(f.date && typeof v === "number") v = serialToISO(v);
    o[f.n] = v;
    if(!f.fx && v !== "") filled = true;
  });
  o.__filled = filled;
  return o;
}
const serialToISO = s => new Date(Math.round((s-25569)*86400000)).toISOString().slice(0,10);
const isoToSerial = d => { const t = Date.parse(d+"T00:00:00Z"); return isNaN(t)?d:t/86400000+25569; };

/* ============================================================
   4. WRITE
   ============================================================ */
async function writeRow(tn, values, rowIndex){
  const t = T[tn], rg = RANGE[tn];
  const sheetRow = rg.r1 + 1 + rowIndex;
  const addr = `${rg.c1}${sheetRow}:${rg.c2}${sheetRow}`;
  const arr = t.fields.map(f => {
    if(f.fx) return null;                       // never overwrite a formula
    let v = values[f.n];
    if(v === "" || v === undefined) return null;
    if(f.date) return isoToSerial(v);
    if(f.num) { const n = parseFloat(v); return isNaN(n) ? v : n; }
    return v;
  });
  await g(wbPath(`/worksheets/${t.sheetId}/range(address='${addr}')`),
          { method:"PATCH", body:JSON.stringify({ values:[arr] }) });
  await reloadTable(tn);
}
async function reloadTable(tn){
  const t = T[tn];
  const rg = await g(wbPath(`/tables/${t.id}/range?$select=values,address`));
  RANGE[tn] = parseAddr(rg.address);
  DATA[tn] = rg.values.slice(1).map((row,ri) => rowObj(t.fields, row, ri)).filter(r => r.__filled);
}
function nextFreeIndex(tn){
  const rows = DATA[tn];
  return rows.length ? Math.max(...rows.map(r => r.__row)) + 1 : 0;
}
async function appendToList(key, value){
  const id = SHEETID["_Lists"];
  const u = await g(wbPath(`/worksheets/${id}/usedRange?$select=values,address`));
  const head = u.values[1] || [];
  const c = head.findIndex(h => String(h||"").trim() === key);
  if(c < 0) throw new Error(`No column called "${key}" on the _Lists sheet`);
  let r = 2;
  while(u.values[r] && u.values[r][c] !== "" && u.values[r][c] != null) r++;
  const col = String.fromCharCode(65 + c);
  await g(wbPath(`/worksheets/${id}/range(address='${col}${r+1}')`),
          { method:"PATCH", body:JSON.stringify({ values:[[value]] }) });
  (LISTS[key] = LISTS[key] || []).push(value);
}


/* No offline sample mode in this build. Nothing about the workbook — schema,
   formulas, or data — exists anywhere in this file until a real LBBC sign-in
   succeeds and it is fetched live from SharePoint. */

/* ============================================================
   5. INFERENCE  —  everything the app understands about your schema,
      worked out from three signals only: does the column hold a
      formula, is it named "<Sheet> Label", is it on _Lists.
   ============================================================ */
let T = {}, TNAMES = [];
function index(){
  T = {}; TNAMES = SCHEMA.tables.map(t => t.name);
  SCHEMA.tables.forEach(t => T[t.name] = t);
}
const ALIAS = {};                                     // no aliasing: Operator has its own list
const listKey = f => ALIAS[f.n] || f.n;
const listOf  = f => LISTS[listKey(f)];
const target  = f => f.n.slice(0, -6);
function role(tn, f){
  if(f.fx) return "calc";
  if(f.n.endsWith(" Label") && TNAMES.includes(target(f))) return "lookup";
  if(listOf(f)) return "choice";
  if(f.date) return "date";
  if(f.num) return "number";
  return "text";
}
const HIDE = new Set(["Ref"]);                        // shown in detail, never in tables
const lookups  = tn => T[tn].fields.filter(f => role(tn, f) === "lookup");
const children = tn => SCHEMA.tables.filter(t => lookups(t.name).some(f => target(f) === tn));
const desc     = (tn, f) => FIELDS[tn + "|" + f.n] || "";
const labelOf  = tn => T[tn].fields.some(f => f.n === "Label") ? "Label" : "Ref";
const rowLabel = (tn, r) => String(r[labelOf(tn)] ?? "");
const byLabel  = (tn, l) => (DATA[tn] || []).find(r => rowLabel(tn, r) === l);
const dupOf    = (tn, r) => String(r["Duplicate?"] ?? "");
function depth(tn, seen = {}){
  if(seen[tn]) return 0; seen[tn] = 1;
  const p = lookups(tn);
  return p.length ? 1 + Math.max(...p.map(f => depth(target(f), {...seen}))) : 0;
}
/* previous entries in a free-text column, offered as suggestions */
function seen(tn, f){
  const vals = (DATA[tn] || []).map(r => String(r[f.n] ?? "").trim()).filter(Boolean);
  return [...new Set(vals)].sort().slice(0, 12);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = s => { if(!s) return ""; const p = String(s).split("-"); return p[2] ? `${p[2]}/${p[1]}/${p[0]}` : s; };
const fmtNum = v => v === "" || v == null ? "" : (typeof v === "number" ? +v.toFixed(4) : v);

/* ============================================================
   7. SCREENS
   ============================================================ */
let view = { mode:"list", table:null, row:null }, draft = {}, editing = null, q = "";


function banner(){
  if(err) return `<div class="banner bad"><b>Could not reach the workbook.</b> ${esc(err)}
    <button data-retry="1">Try again</button></div>`;
  if(busy) return `<div class="banner good"><span class="spin"></span>${esc(busy)}&hellip;</div>`;
  if(live) return `<div class="banner good"><b>Connected.</b> Reading and writing
    ${esc(CONFIG.filePath)} on ${esc(CONFIG.siteHost)}.<button data-refresh="1">Refresh</button></div>`;
  return `<div class="banner warn"><b>Not connected &mdash; sample copy.</b>
    These are the example rows from the workbook, held in memory. Nothing you enter is saved.
    <button data-setup="1">How to connect</button></div>`;
}
function readout(){
  const cols = SCHEMA.tables.reduce((s,t) => s + t.fields.length, 0);
  const rows = Object.values(DATA).reduce((s,a) => s + a.length, 0);
  const lk = SCHEMA.tables.reduce((s,t) => s + lookups(t.name).length, 0);
  const fx = SCHEMA.tables.reduce((s,t) => s + t.fields.filter(f => f.fx).length, 0);
  return `<span class="live">${live ? "live from" : "sample of"} <b>${esc(SCHEMA.workbook)}</b></span>
    <span><b>${SCHEMA.tables.length}</b> sheets</span><span><b>${cols}</b> columns</span>
    <span><b>${lk}</b> links found</span><span><b>${fx}</b> formulas</span><span><b>${rows}</b> rows</span>`;
}
function rail(){
  let h = `<div class="rail-head">Sheets in workbook</div>`;
  SCHEMA.tables.forEach(t => {
    h += `<button class="depth${Math.min(depth(t.name),2)}" aria-current="${view.table===t.name&&view.mode!=="setup"}"
      data-t="${esc(t.name)}"><span>${esc(t.name)}</span><span class="n">${(DATA[t.name]||[]).length}</span></button>`;
  });
  return h + `<div class="rail-head" style="padding-top:20px">Setup</div>
    <button data-setup="1" aria-current="${view.mode==="setup"}"><span>Connect to workbook</span></button>`;
}

function list(tn){
  const t = T[tn], rows = DATA[tn] || [], ql = q.toLowerCase();
  const cols = t.fields.filter(f => !HIDE.has(f.n));
  const shown = ql ? rows.filter(r => cols.some(f => String(r[f.n]??"").toLowerCase().includes(ql))) : rows;
  const up = lookups(tn).map(target), down = children(tn).map(t => t.name);
  const dups = rows.filter(r => dupOf(tn, r)).length;

  let h = `<h2>${esc(tn)}</h2><p class="sub">Excel table <code>${esc(t.table)}</code> &middot; ${t.fields.length} columns`;
  if(up.length) h += ` &middot; reads ${up.map(esc).join(", ")}`;
  if(down.length) h += ` &middot; feeds ${down.map(esc).join(", ")}`;
  h += `</p>`;
  if(dups) h += `<div class="dupwarn">${dups} row${dups>1?"s have":" has"} a duplicate label.
    Other sheets cannot tell those records apart &mdash; open each one and change its description.</div>`;
  h += `<div class="bar"><button class="btn" data-new="1">Add ${esc(tn.toLowerCase())} record</button>
    <input class="search" placeholder="Filter rows" value="${esc(q)}" data-q="1"></div>`;

  if(!shown.length) return h + `<div class="tablewrap"><p class="empty">${rows.length
    ? "No rows match that filter." : "No rows yet. Add the first one above."}</p></div>`;

  h += `<div class="tablewrap"><table><thead><tr>`;
  cols.forEach(f => { const rl = role(tn,f);
    h += `<th>${esc(f.n)}${rl==="calc"?'<span class="fx" title="Excel works this out">fx</span>':""}${
      rl==="lookup"?`<span class="lk" title="Links to ${esc(target(f))}">&rarr;</span>`:""}</th>`; });
  h += `</tr></thead><tbody>`;
  shown.forEach(r => {
    h += `<tr data-i="${rows.indexOf(r)}">`;
    cols.forEach(f => { const rl = role(tn,f), v = r[f.n] ?? "";
      const cls = f.n==="Duplicate?" ? "dup" : f.n==="Label" ? "key"
        : rl==="calc" ? "calc" : rl==="number" ? "num" : "";
      h += `<td class="${cls}">${esc(rl==="date"?fmtDate(v):rl==="number"?fmtNum(v):v)||"&mdash;"}</td>`; });
    h += `</tr>`;
  });
  return h + `</tbody></table></div>`;
}

function form(tn){
  const t = T[tn], isEdit = editing !== null;
  let h = `<div class="crumb"><button data-back="1">${esc(tn)}</button> / ${isEdit?"edit":"new record"}</div>
  <h2>${isEdit?"Edit":"Add"} ${esc(tn.toLowerCase())}</h2>
  <p class="sub">Every field here came from the workbook. Add a column in Excel and it turns up in this form.</p>
  <div class="form"><fieldset><legend>You enter</legend><div class="grid">`;

  t.fields.forEach(f => {
    const rl = role(tn, f); if(rl === "calc") return;
    const id = "f_" + f.n.replace(/\W/g,"_"), d = desc(tn,f), v = draft[f.n] ?? "";
    const wide = /Notes|Description|Function|Attachment/.test(f.n);
    h += `<div class="f${wide?" wide":""}"><label for="${id}">${esc(f.n)}</label>`;
    if(d) h += `<span class="hint">${esc(d)}</span>`;
    if(rl === "lookup"){
      const tg = target(f), opts = (DATA[tg]||[]).map(r => rowLabel(tg,r)).filter(Boolean);
      h += `<select id="${id}" data-f="${esc(f.n)}"><option value="">Select a ${esc(tg.toLowerCase())}</option>`;
      opts.forEach(o => h += `<option${o===v?" selected":""}>${esc(o)}</option>`);
      h += `</select>`;
      if(!opts.length) h += `<span class="hint" style="color:var(--alert)">No ${esc(tg)} rows yet. Add one first.</span>`;
    } else if(rl === "choice"){
      h += `<div class="addrow"><select id="${id}" data-f="${esc(f.n)}"><option value="">Select</option>`;
      listOf(f).forEach(o => h += `<option${String(o)===String(v)?" selected":""}>${esc(o)}</option>`);
      h += `</select><button type="button" data-grow="${esc(f.n)}" title="Add an option to the _Lists sheet">+</button></div>`;
    } else if(rl === "date"){
      h += `<input id="${id}" type="date" value="${esc(v)}" data-f="${esc(f.n)}">`;
    } else if(rl === "number"){
      h += `<input id="${id}" type="number" step="any" value="${esc(v)}" data-f="${esc(f.n)}">`;
    } else {
      h += `<input id="${id}" type="text" value="${esc(v)}" data-f="${esc(f.n)}" autocomplete="off">`;
      const s = seen(tn, f).filter(x => x !== v);
      if(s.length) h += `<div class="sugg">` +
        s.map(x => `<button type="button" data-fill="${esc(f.n)}|${esc(x)}">${esc(x)}</button>`).join("") + `</div>`;
    }
    h += `</div>`;
  });
  h += `</div></fieldset>`;

  const cs = t.fields.filter(f => f.fx);
  if(cs.length){
    h += `<fieldset><legend>Excel works these out when you save</legend><div class="grid">`;
    cs.forEach(f => h += `<div class="f${f.n==="Label"?" wide":""}"><label>${esc(f.n)}</label>
      <div class="ro">&mdash;</div><span class="fxnote">${esc(f.fx)}</span></div>`);
    h += `</div></fieldset>`;
  }
  return h + `<div class="bar" style="margin:0">
    <button class="btn" data-save="1">${isEdit?"Save changes":"Save to workbook"}</button>
    <button class="btn ghost" data-back="1">Cancel</button></div></div>`;
}

function chainHTML(tn, row, here){
  let inner = `<button class="link${here?" here":""}" data-go="${esc(tn)}|${DATA[tn].indexOf(row)}">
    <span class="t">${esc(tn)}</span><span class="v">${esc(rowLabel(tn,row))||"&mdash;"}</span></button>`;
  const ps = lookups(tn);
  if(ps.length === 1){
    const p = byLabel(target(ps[0]), row[ps[0].n]);
    if(p) inner += `<span class="joint">&#8592;</span>` + chainHTML(target(ps[0]), p, false);
  }
  let out = `<div class="chain">${inner}</div>`;
  if(ps.length > 1) ps.forEach(f => {
    const p = byLabel(target(f), row[f.n]);
    if(p) out += `<div class="branch">${chainHTML(target(f), p, false)}</div>`;
  });
  return out;
}

function record(tn, i){
  const t = T[tn], row = DATA[tn][i], dup = dupOf(tn, row);
  let h = `<div class="crumb"><button data-back="1">${esc(tn)}</button> / record ${i+1}</div>
  <h2>${esc(rowLabel(tn,row)) || esc(tn)}</h2>
  <p class="sub">Everything this row connects to, upstream and downstream.</p>`;
  if(dup) h += `<div class="dupwarn">${esc(dup)}. Until you do, any sheet referring to this
    label may resolve to the wrong record.</div>`;
  h += `<div class="bar"><button class="btn ghost" data-edit="${i}">Edit this record</button></div>
  <div class="pane"><h3>Where this came from</h3>${chainHTML(tn,row,true)}</div>
  <div class="pane"><h3>Fields</h3><dl class="kv">`;
  t.fields.forEach(f => {
    const rl = role(tn,f), v = row[f.n] ?? "";
    h += `<div><dt>${esc(f.n)} ${rl==="calc"?'<span class="chip fx">fx</span>'
      : rl==="lookup"?'<span class="chip lk">link</span>':""}</dt>`;
    if(rl === "lookup"){
      const tg = target(f), p = byLabel(tg,v), pi = p ? DATA[tg].indexOf(p) : -1;
      h += `<dd>${pi>=0 ? `<button data-go="${esc(tg)}|${pi}">${esc(v)}</button>`
        : (v ? esc(v)+` <span class="chip" style="color:var(--alert)">no match</span>` : "&mdash;")}</dd>`;
    } else {
      h += `<dd class="${rl==="calc"?"calc":rl==="number"?"mono":""}">${
        esc(rl==="date"?fmtDate(v):rl==="number"?fmtNum(v):v)||"&mdash;"}</dd>`;
    }
    h += `</div>`;
  });
  h += `</dl></div>`;
  const lb = rowLabel(tn, row);
  children(tn).forEach(ct => {
    const f = lookups(ct.name).find(f => target(f) === tn);
    const kids = (DATA[ct.name] || []).filter(r => String(r[f.n] ?? "") === lb);
    h += `<div class="pane"><h3>${esc(ct.name)} &mdash; ${kids.length} linked</h3>`;
    if(!kids.length){ h += `<p class="empty" style="padding:8px 0">Nothing recorded against this yet.</p></div>`; return; }
    const cols = ct.fields.filter(cf => !HIDE.has(cf.n));
    h += `<div class="tablewrap"><table><thead><tr>`;
    cols.forEach(cf => h += `<th>${esc(cf.n)}</th>`);
    h += `</tr></thead><tbody>`;
    kids.forEach(kr => {
      h += `<tr data-go="${esc(ct.name)}|${DATA[ct.name].indexOf(kr)}">`;
      cols.forEach(cf => { const rl = role(ct.name,cf), v = kr[cf.n] ?? "";
        const cls = cf.n==="Duplicate?"?"dup":cf.n==="Label"?"key":rl==="calc"?"calc":rl==="number"?"num":"";
        h += `<td class="${cls}">${esc(rl==="date"?fmtDate(v):rl==="number"?fmtNum(v):v)||"&mdash;"}</td>`; });
      h += `</tr>`;
    });
    h += `</tbody></table></div></div>`;
  });
  return h;
}

function setup(){
  return `<h2>Connect to the workbook</h2>
  <p class="sub">Three values are needed, and only your Microsoft 365 administrator can issue the first two.</p>
  <div class="connect setup">
    <span class="status">${live ? "Connected" : "Not connected"}</span>
    <p><b>What to ask IT for</b></p>
    <ol>
      <li>An <b>app registration</b> in Entra ID (Azure AD), of type <b>Single-page application</b>.
          Ask them for the <b>Application (client) ID</b> and the <b>Directory (tenant) ID</b>.</li>
      <li>This page's own address added as a <b>redirect URI</b> on that registration.
          If you are running the file locally, that address is
          <code>${esc(location.origin + location.pathname)}</code></li>
      <li><b>Delegated</b> Microsoft Graph permission <code>Sites.ReadWrite.All</code>,
          with admin consent granted.</li>
    </ol>
    <p><b>Then edit this file</b> &mdash; open it in Notepad or VS Code, find the CONFIG block at
       the top of the script, and fill in these four values:</p>
    <pre>const CONFIG = {
  clientId: <span class="s">"the Application (client) ID"</span>,
  tenantId: <span class="s">"the Directory (tenant) ID"</span>,
  siteHost: <span class="s">"${esc(CONFIG.siteHost)}"</span>,
  sitePath: <span class="s">"${esc(CONFIG.sitePath)}"</span>,
  filePath: <span class="s">"${esc(CONFIG.filePath)}"</span>
};</pre>
    <p><code>sitePath</code> is the part of your SharePoint address after the host name.
       <code>filePath</code> is where the workbook sits inside that site's document library.</p>
    <p><b>One catch worth knowing.</b> This page must be served over http, not opened as a file,
       or sign-in will refuse to run. The quickest way: put this file in a folder, open a terminal
       there, run <code>python -m http.server 8080</code>, then visit
       <code>http://localhost:8080</code> and give IT that address as the redirect URI in step 2.</p>
    <p><b>And one rule.</b> Do not have the workbook open in the installed desktop Excel while
       using this app. Desktop Excel locks the file and writes will fail. Excel in the browser is fine.</p>
  </div>`;
}

/* ============================================================
   8. RENDER + EVENTS
   ============================================================ */
function render(){
  if(!view.table && TNAMES.length) view.table = TNAMES[0];
  document.getElementById("banner").innerHTML = banner();
  document.getElementById("readout").innerHTML = readout();
  document.getElementById("rail").innerHTML = TNAMES.length ? rail() : "";
  const m = document.getElementById("main");
  m.innerHTML = view.mode === "setup" ? setup()
    : !TNAMES.length ? `<p class="empty">Loading&hellip;</p>`
    : view.mode === "form" ? form(view.table)
    : view.mode === "record" ? record(view.table, view.row)
    : list(view.table);
  wire();
}
function on(sel, fn){ document.querySelectorAll(sel).forEach(el => fn(el)); }
function wire(){
  on("[data-t]", b => b.onclick = () => { q=""; view={mode:"list",table:b.dataset.t,row:null}; render(); });
  on("[data-setup]", b => b.onclick = () => { view={...view, mode:"setup"}; render(); });
  on("[data-retry]", b => b.onclick = () => { err=null; boot(); });
  on("[data-refresh]", b => b.onclick = async () => {
    try { busy="Refreshing"; render(); for(const t of SCHEMA.tables) await reloadTable(t.name);
          busy=""; render(); toast("Refreshed from the workbook"); }
    catch(e){ busy=""; err=e.message; render(); }
  });
  on("[data-new]", b => b.onclick = () => { draft={}; editing=null; view.mode="form"; render(); });
  on("[data-back]", b => b.onclick = () => { editing=null; view.mode="list"; view.row=null; render(); });
  on("[data-edit]", b => b.onclick = () => {
    editing = DATA[view.table][+b.dataset.edit].__row;
    draft = {...DATA[view.table][+b.dataset.edit]}; view.mode="form"; render();
  });
  on("[data-go]", b => b.onclick = e => { e.stopPropagation();
    const [t,i] = b.dataset.go.split("|"); view={mode:"record",table:t,row:+i}; render();
    window.scrollTo({top:0,behavior:"smooth"}); });
  on("tbody tr[data-i]", tr => tr.onclick = () => {
    view={mode:"record",table:view.table,row:+tr.dataset.i}; render(); });

  const s = document.querySelector("[data-q]");
  if(s) s.oninput = () => { const p=s.selectionStart; q=s.value; render();
    const n=document.querySelector("[data-q]"); n.focus(); n.setSelectionRange(p,p); };

  on("[data-f]", el => {
    el.onchange = () => { draft[el.dataset.f] = el.value; if(el.tagName==="SELECT") render(); };
    el.oninput = () => { draft[el.dataset.f] = el.value; };
  });
  on("[data-fill]", b => b.onclick = () => {
    const [f, v] = b.dataset.fill.split("|"); draft[f] = v; render();
    const n = document.querySelector(`[data-f="${f}"]`); if(n) n.focus();
  });
  on("[data-grow]", b => b.onclick = async () => {
    const fn = b.dataset.grow, f = T[view.table].fields.find(x => x.n === fn), k = listKey(f);
    const v = (prompt(`New option for ${fn}.\nIt is added to the ${k} column of the _Lists sheet.`)||"").trim();
    if(!v || LISTS[k].map(String).includes(v)) return;
    try {
      if(live){ busy = "Adding to _Lists"; render(); await appendToList(k, v); busy=""; }
      else LISTS[k].push(v);
      draft[fn] = v; render(); toast(`Added "${v}" to _Lists`);
    } catch(e){ busy=""; err = e.message; render(); }
  });

  const sv = document.querySelector("[data-save]");
  if(sv) sv.onclick = async () => {
    const tn = view.table;
    const miss = lookups(tn).filter(f => !draft[f.n]).map(f => f.n);
    if(miss.length) return toast(`Pick a value for ${miss.join(" and ")} first`);
    const anything = T[tn].fields.some(f => !f.fx && String(draft[f.n]??"") !== "");
    if(!anything) return toast("Nothing to save yet");
    try {
      if(live){
        busy = editing !== null ? "Saving changes" : "Saving to the workbook"; render();
        await writeRow(tn, draft, editing !== null ? editing : nextFreeIndex(tn));
        busy = "";
      } else {
        const row = { __row: editing !== null ? editing : (DATA[tn].length), __filled:true };
        T[tn].fields.forEach(f => row[f.n] = f.fx ? "" : (draft[f.n] ?? ""));
        if(editing !== null){ const k = DATA[tn].findIndex(r => r.__row === editing); DATA[tn][k] = row; }
        else DATA[tn].push(row);
      }
      const saved = live ? DATA[tn].find(r => r.__row === (editing!==null?editing:nextFreeIndex(tn)-1)) : null;
      draft={}; editing=null; view.mode="list"; render();
      toast(live ? "Saved to the workbook" : "Saved in this sample copy only");
      if(saved && dupOf(tn, saved)) toast("Saved, but that label duplicates an existing one");
    } catch(e){ busy=""; err = e.message; render(); }
  };
}
function toast(m){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const d = document.createElement("div"); d.className = "toast"; d.textContent = m;
  document.body.appendChild(d); setTimeout(() => d.remove(), 3000);
}

/* ============================================================
   9. SIGN-IN GATE
   Nothing about the workbook — not even the sample schema — renders
   until Microsoft has confirmed the person is signed in. Because the
   app registration is single-tenant, that gate is also, automatically,
   an LBBC-only gate: no LBBC account, no popup success, nothing shown.
   ============================================================ */
let gateErr = null, gateBusy = "Loading";

function gate(){
  document.getElementById("banner").innerHTML = "";
  document.getElementById("readout").innerHTML = "";
  document.getElementById("rail").innerHTML = "";
  document.getElementById("main").innerHTML = `
    <div class="pane" style="max-width:480px;margin:60px auto;text-align:center">
      <h2 style="margin-bottom:6px">Leaching rig data recorder</h2>
      <p class="sub">Sign in with your LBBC Microsoft account to continue. Nothing on this
        page is visible before that, and only LBBC accounts can sign in.</p>
      ${gateErr ? `<div class="dupwarn" style="text-align:left">${esc(gateErr)}</div>` : ""}
      <button class="btn" id="signin" ${gateBusy?"disabled":""}>
        ${gateBusy ? `<span class="spin"></span>${esc(gateBusy)}&hellip;` : "Sign in with Microsoft"}</button>
    </div>`;
  const b = document.getElementById("signin");
  if(b) b.onclick = () => {
    gateErr = null; gateBusy = "Taking you to Microsoft sign-in"; gate();
    beginSignIn().catch(e => { gateBusy=""; gateErr = e.message || String(e); gate(); });
  };
}
async function proceedToWorkbook(){
  gateBusy = "Loading the workbook"; gate();
  try { await loadLive(); index(); gateBusy=""; render(); }
  catch(e){ gateBusy=""; gateErr = e.message || String(e); gate(); }
}

/* ============================================================
   10. BOOT
   initAuth runs on every page load, including the one right after
   Microsoft redirects back here. If it finds a signed-in account —
   either already cached, or from that redirect — it skips the button
   entirely and goes straight to the workbook.
   ============================================================ */
gate();
(async () => {
  try {
    if(!CONFIG.clientId){ gateBusy=""; gateErr = "This app has not been connected to a workbook yet."; gate(); return; }
    await initAuth();
    if(account) await proceedToWorkbook();
    else { gateBusy=""; gate(); }
  } catch(e){ gateBusy=""; gateErr = e.message || String(e); gate(); }
})();

</script>
</body>
